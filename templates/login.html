<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 药妆智多星</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .login-card {
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 40px 32px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .login-title {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
    }
    .login-subtitle {
      font-size: 13px;
      color: #888;
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: #6366f1;
    }
    .form-input::placeholder {
      color: #555;
    }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #5558e6;
    }
    .btn-primary:disabled {
      background: #333;
      cursor: not-allowed;
    }
    .error-msg {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .switch-mode {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
    .switch-mode a {
      color: #6366f1;
      cursor: pointer;
      text-decoration: none;
    }
    .switch-mode a:hover {
      text-decoration: underline;
    }
    .demo-hint {
      text-align: center;
      margin-top: 20px;
      padding: 12px;
      background: #1a1a2e;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
    }
    .demo-hint code {
      color: #a78bfa;
      background: #252540;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">🤖</div>
        <div class="login-title">药妆智多星</div>
        <div class="login-subtitle" id="formTitle">智能客服系统 · 登录</div>
      </div>

      <form id="authForm">
        <div class="form-group" id="displayNameGroup" style="display:none">
          <label class="form-label">显示名称</label>
          <input class="form-input" id="displayName" placeholder="您的名字（选填）" maxlength="64">
        </div>
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input class="form-input" id="username" placeholder="请输入用户名" required maxlength="32" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input class="form-input" id="password" type="password" placeholder="请输入密码" required maxlength="64" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="submitBtn" type="submit">登录</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>

      <div class="switch-mode">
        <span id="switchText">没有账号？</span>
        <a id="switchLink">注册</a>
      </div>

      <div class="demo-hint" id="demoHint" style="display:none">
        演示账号：<code>admin</code> / <code>admin123</code>
      </div>
    </div>
  </div>

  <script>
    let isLogin = true;

    function toggleMode() {
      isLogin = !isLogin;
      document.getElementById('formTitle').textContent = isLogin
        ? '智能客服系统 · 登录'
        : '智能客服系统 · 注册';
      document.getElementById('submitBtn').textContent = isLogin ? '登录' : '注册';
      document.getElementById('displayNameGroup').style.display = isLogin ? 'none' : 'block';
      document.getElementById('switchText').textContent = isLogin ? '没有账号？' : '已有账号？';
      document.getElementById('switchLink').textContent = isLogin ? '注册' : '登录';
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('password').value = '';
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = isLogin ? '登录中...' : '注册中...';

      try {
        const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';
        const body = { username, password };
        if (!isLogin) {
          body.display_name = document.getElementById('displayName').value.trim();
        }

        const resp = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.detail || data.error || '操作失败');
        }

        if (isLogin) {
          // 存储 token
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify({
            user_id: data.user_id,
            username: data.username,
            role: data.role,
            display_name: data.display_name,
          }));
          window.location.href = '/';
        } else {
          // 注册成功 → 自动登录
          toggleMode();
          document.getElementById('username').value = username;
          document.getElementById('password').value = password;
          errorMsg.textContent = '注册成功！请登录';
          errorMsg.style.color = '#22c55e';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.color = '#ef4444';
        errorMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = isLogin ? '登录' : '注册';
      }
    }

    // 仅开发环境显示演示账号提示
    fetch('/api/health').then(r => r.json()).then(d => {
      if (d.mode === 'dev') document.getElementById('demoHint').style.display = 'block';
    }).catch(() => {});

    // 已登录则跳转
    if (localStorage.getItem('token')) {
      window.location.href = '/';
    }

    // CSP 安全：通过 addEventListener 绑定事件（替代内联 onsubmit/onclick）
    document.getElementById('authForm').addEventListener('submit', handleSubmit);
    document.getElementById('switchLink').addEventListener('click', toggleMode);
  </script>
</body>
</html>
