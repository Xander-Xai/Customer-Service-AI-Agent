[mypy]
# 药妆智多星 — mypy 类型检查配置
# 采用渐进式策略：先宽松，逐步收紧

python_version = 3.10
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = False          # 渐进式：暂不检查无注解函数
disallow_untyped_defs = False       # 渐进式：暂不要求所有函数有注解
ignore_missing_imports = True       # 第三方库 stubs 不全
no_implicit_optional = True
strict_equality = True

# 模块级放宽：这些模块存在较多类型问题，逐步修复
[mypy-multi_agent_customer_service.*]
# v4.5 已大幅减少类型问题，保留宽松设置
disallow_untyped_defs = False
no_implicit_optional = False

[mypy-config]
# config.py 大量 os.getenv 调用，类型推断困难
disallow_untyped_defs = False

[mypy-erp.kingdee_adapter]
# Mock/Real 双实现导致类型不一致
disallow_untyped_defs = False
