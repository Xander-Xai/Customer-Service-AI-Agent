[mypy]
# 药妆智多星 — mypy 类型检查配置
# 采用渐进式策略：先宽松，逐步收紧

python_version = 3.10
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = False
disallow_untyped_defs = False
ignore_missing_imports = True
no_implicit_optional = True
strict_equality = True

# ===== v5.1: 新增模块严格模式 =====
# 新模块采用完整类型注解，启用严格检查
[mypy-core.protocols.*]
disallow_untyped_defs = True
check_untyped_defs = True
warn_return_any = True

[mypy-core.token_tracker.*]
disallow_untyped_defs = True
check_untyped_defs = True
warn_return_any = True

[mypy-core.prompt_manager.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-rag.reranker.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-rag.query_rewriter.*]
disallow_untyped_defs = True
check_untyped_defs = True

[mypy-api.dependencies.*]
disallow_untyped_defs = True
check_untyped_defs = True

# ===== 已有模块：渐进式放宽 =====
[mypy-core.graph_builder.*]
disallow_untyped_defs = False
no_implicit_optional = False

[mypy-multi_agent_customer_service.*]
disallow_untyped_defs = False
no_implicit_optional = False

[mypy-core.config]
disallow_untyped_defs = False

[mypy-config]
disallow_untyped_defs = False

[mypy-core.session.*]
disallow_untyped_defs = False
no_implicit_optional = False

[mypy-erp.kingdee_adapter]
disallow_untyped_defs = False
