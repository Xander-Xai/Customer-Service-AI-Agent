# promtool 单元测试 — 针对**真实的** monitoring/alert_rules.yml
#
# 运行（官方 promtool，不是自制模拟器）：
#   make alert-rules-test
#
# 为什么需要它
# ------------
# `AgentRunDeadLetterDetected` 的表达式 `increase(agent_run_dead_letter_total[5m]) > 0`
# 长期「看起来对」——语法合法、指标名在代码里真实存在——但只要该时间序列收不到样本，
# 就**永远不可能**触发。YAML 结构断言抓不到这一类断链：它读文本，不读时序。
#
# 关键设计：这里 `rule_files` 引用的是**正在生效的那份** alert_rules.yml，
# 不是它的副本。副本会漂移 —— 改了真规则、忘了改测试，测试照样绿。
# 同一批断言因此**同时**钉住「表达式语义」与「仓库里真实规则」两者。
#
# 三个场景分别覆盖：真触发 / 历史值不复发 / 从未发生。
rule_files:
  - alert_rules.yml

evaluation_interval: 1m

tests:
  # ── 场景 1：确有新的 dead-letter -> 必须 firing ────────────────────────────
  # 0 维持 5 分钟后出现新增（第 6 分钟起 increase > 0），配合 `for: 1m`
  # 必须在第 7 分钟进入 firing。若表达式被改成裸 `> 0`，本场景仍会过 ——
  # 防的是「永远不触发」那一侧；那一侧由场景 2 单独钉住。
  - interval: 1m
    input_series:
      - series: 'agent_run_dead_letter_total'
        values: '0+0x5 1+1x5 6+0x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: AgentRunDeadLetterDetected
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "检测到新的 AgentRun dead-letter"
              description: "过去 5 分钟新增 2 个 dead-letter（重试耗尽）。检查 GET /api/runs/dead 与 agent_dead_letters 表，判断是否可重放。"
              runbook_url: "https://github.com/Xander-Xai/Customer-Service-AI-Agent/blob/main/docs/operations/distributed-runtime-runbook.md#33-dead_letter-堆积"

  # ── 场景 2：历史上有过一次，之后长期无新增 -> 绝不允许 latching ─────────────
  # 若有人把表达式改成 `agent_run_dead_letter_total > 0`，这里会立刻失败：
  # 计数器停在 3 不再增长，但表达式恒真，告警会永久挂着。
  - interval: 1m
    input_series:
      - series: 'agent_run_dead_letter_total'
        values: '3+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunDeadLetterDetected
        exp_alerts: []

  # ── 场景 3：从未发生过 dead-letter -> 绝不触发 ──────────────────────────────
  - interval: 1m
    input_series:
      - series: 'agent_run_dead_letter_total'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunDeadLetterDetected
        exp_alerts: []
