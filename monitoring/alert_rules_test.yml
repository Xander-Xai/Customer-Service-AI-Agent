# promtool 单元测试 — 针对**真实的** monitoring/alert_rules.yml
#
# 运行（官方 promtool，不是自制模拟器）：
#   make alert-rules-test
#
# 为什么需要它
# ------------
# `AgentRunDeadLetterDetected` 的表达式 `increase(agent_run_dead_letter_total[5m]) > 0`
# 长期「看起来对」——语法合法、指标名在代码里真实存在——但只要该时间序列收不到样本，
# 就**永远不可能**触发。YAML 结构断言抓不到这一类断链：它读文本，不读时序。
#
# 关键设计：这里 `rule_files` 引用的是**正在生效的那份** alert_rules.yml，
# 不是它的副本。副本会漂移 —— 改了真规则、忘了改测试，测试照样绿。
# 同一批断言因此**同时**钉住「表达式语义」与「仓库里真实规则」两者。
#
# 三个场景分别覆盖：真触发 / 历史值不复发 / 从未发生。
rule_files:
  - alert_rules.yml

evaluation_interval: 1m

tests:
  # ── 场景 1：确有新的 dead-letter -> 必须 firing ────────────────────────────
  # 0 维持 5 分钟后出现新增（第 6 分钟起 increase > 0），配合 `for: 1m`
  # 必须在第 7 分钟进入 firing。若表达式被改成裸 `> 0`，本场景仍会过 ——
  # 防的是「永远不触发」那一侧；那一侧由场景 2 单独钉住。
  - interval: 1m
    input_series:
      - series: 'agent_run_dead_letter_total'
        values: '0+0x5 1+1x5 6+0x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: AgentRunDeadLetterDetected
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "检测到新的 AgentRun dead-letter"
              description: "过去 5 分钟新增 2 个 dead-letter（重试耗尽）。检查 GET /api/runs/dead 与 agent_dead_letters 表，判断是否可重放。"
              runbook_url: "https://github.com/Xander-Xai/Customer-Service-AI-Agent/blob/main/docs/operations/distributed-runtime-runbook.md#33-dead_letter-堆积"

  # ── 场景 2：历史上有过一次，之后长期无新增 -> 绝不允许 latching ─────────────
  # 若有人把表达式改成 `agent_run_dead_letter_total > 0`，这里会立刻失败：
  # 计数器停在 3 不再增长，但表达式恒真，告警会永久挂着。
  - interval: 1m
    input_series:
      - series: 'agent_run_dead_letter_total'
        values: '3+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunDeadLetterDetected
        exp_alerts: []

  # ── 场景 3：从未发生过 dead-letter -> 绝不触发 ──────────────────────────────
  - interval: 1m
    input_series:
      - series: 'agent_run_dead_letter_total'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentRunDeadLetterDetected
        exp_alerts: []

# ═══════════════════════════════════════════════════════════════════════════
# 恢复闭环（reconciler）停滞告警 —— 五个必须覆盖的场景
#
# 关键点：**beat 存活与扫描成功是两个正交信号**。beat 的健康检查只看 schedule 文件
# mtime，进程活着就一直更新，所以「beat 活着但扫描一直失败」时它是绿的。这里用
# 「最近一次成功扫描距今多久」而不是失败计数，因此调度停止与扫描失败都能被发现。
#
# 本段的 exp_annotations 由 scripts/sync_alert_rule_test_annotations.py 从
# alert_rules.yml 生成，不要手工改文案。
# ═══════════════════════════════════════════════════════════════════════════

  # ── 场景 1：正常扫描 -> 绝不触发 ──────────────────────────────────────────
  # gauge 跟随 wall-clock 递增，因此 time() - gauge 恒为 0。
  - interval: 1m
    input_series:
      - series: 'agent_reconcile_last_success_timestamp_seconds'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: AgentReconcileStalled
        exp_alerts: []

  # ── 场景 2：时间戳停更（beat 不再调度，或扫描一直失败）-> 必须触发 ────────
  - interval: 1m
    input_series:
      - series: 'agent_reconcile_last_success_timestamp_seconds'
        values: '100+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentReconcileStalled
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "恢复调和任务长时间未成功执行"
              description: "最近一次成功的 reconcile 扫描距今超过 360s（约为扫描间隔的 12 倍），或该指标从未出现。beat 进程存活不等于恢复闭环在工作：beat 的健康检查只看 schedule 文件 mtime，扫描本身失败时它仍为绿色。滞留的 RUNNING/QUEUED/PENDING run 不会被收敛——它们不会被重新投递，也不会落 DLQ。排查：curl -s metrics 端点并 grep agent_reconcile；确认 beat service 存活且数据库可达；检查 agent_reconcile_scan_total 中 outcome=error 的计数。"
              runbook_url: "https://github.com/Xander-Xai/Customer-Service-AI-Agent/blob/main/docs/operations/distributed-runtime-runbook.md#recover-loop-stalled"

  # ── 场景 3：指标从未出现（beat 刚部署 / 尚未成功扫描过一次）-> 必须触发 ──
  # absent() 分支。没有它，刚上线时会有一段无监控窗口：闭环可能从一开始就是断的。
  - interval: 1m
    input_series:
      - series: 'up{job="app",instance="a"}'
        values: '1+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: AgentReconcileStalled
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "恢复调和任务长时间未成功执行"
              description: "最近一次成功的 reconcile 扫描距今超过 360s（约为扫描间隔的 12 倍），或该指标从未出现。beat 进程存活不等于恢复闭环在工作：beat 的健康检查只看 schedule 文件 mtime，扫描本身失败时它仍为绿色。滞留的 RUNNING/QUEUED/PENDING run 不会被收敛——它们不会被重新投递，也不会落 DLQ。排查：curl -s metrics 端点并 grep agent_reconcile；确认 beat service 存活且数据库可达；检查 agent_reconcile_scan_total 中 outcome=error 的计数。"
              runbook_url: "https://github.com/Xander-Xai/Customer-Service-AI-Agent/blob/main/docs/operations/distributed-runtime-runbook.md#recover-loop-stalled"

  # ── 场景 4：扫描持续失败（beat 仍调度，但扫描抛错）-> 失败计数告警触发 ────
  - interval: 1m
    input_series:
      - series: 'agent_reconcile_scan_total{outcome="error"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: AgentReconcileScanFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              outcome: "error"
            exp_annotations:
              summary: "恢复调和扫描持续失败"
              description: "过去 10 分钟出现 10 次失败的 reconcile 扫描。beat 仍在调度，但扫描本身在失败——最常见原因是数据库不可达。恢复闭环此刻是断的：滞留 run 不会被重新投递。"

  # ── 场景 5：历史失败过一次、之后无新增 -> 失败计数告警不得 latching ──────
  # 若有人把 increase(...[10m]) > 0 改成 > 0，这里会立刻失败：计数器停在 12
  # 不再增长但表达式恒真，告警永久挂着。
  - interval: 1m
    input_series:
      - series: 'agent_reconcile_scan_total{outcome="error"}'
        values: '12+0x60'
    alert_rule_test:
      - eval_time: 60m
        alertname: AgentReconcileScanFailing
        exp_alerts: []
