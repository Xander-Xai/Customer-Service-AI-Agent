# Prometheus 配置 — 药妆智多星客服系统
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# M5: Alertmanager 告警路由
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'csai-app'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['app:8000']
        labels:
          service: 'customer-service-ai'
    scrape_interval: 10s
