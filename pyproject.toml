[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (FastAPI Depends)
    "SIM108", # use ternary operator (sometimes less readable)
    "UP007",  # use X | Y for union types (not all environments support it)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "logger", "exceptions", "agents", "api", "auth", "cache", "collaboration", "core", "db", "erp", "knowledge", "llm", "media", "rag", "router", "session_manager", "tools"]

[tool.ruff.format]
quote-style = "double"
