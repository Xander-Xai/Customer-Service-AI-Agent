repos:
  - repo: local
    hooks:
      - id: no-env-files
        name: Prevent committing .env files
        entry: bash -c 'for f in "$@"; do case "$f" in .env|.env.*|.env.prod.generated) echo "ERROR: $f must not be committed. Add to .gitignore."; exit 1;; esac; done' --
        language: system
        files: '^\.env'
        pass_filenames: true

      - id: no-api-keys-in-env
        name: Prevent API keys in .env files
        entry: bash -c '! grep -rnE "sk-[A-Za-z0-9]{20,}|api_key=['\''\"]?[A-Za-z0-9]{20,}" --include="*.env*" . 2>/dev/null'
        language: system
        files: '\.env'
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
