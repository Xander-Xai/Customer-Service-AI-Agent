server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    # TLS 证书（替换为真实路径或挂载卷）
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # TLS 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # 最大上传大小（用于 feedback 等 POST 请求）
    client_max_body_size 1m;

    # ===== 灰度发布 upstream 定义 =====
    # v4.1: 添加 ip_hash 保证 WebSocket 会话粘性
    upstream stable_backend {
        ip_hash;
        server app:8000;
    }

    upstream canary_backend {
        ip_hash;
        server canary:8000;
    }

    # 灰度发布：基于 cookie 的流量分割
    # 优先级：cookie 中的 canary_token > 随机分配（10%）
    map $cookie_canary_token $canary_backend {
        "canary" canary_backend;
        default stable_backend;
    }

    # ===== 主应用路由（灰度流量分割）=====
    # 通过 map 指令 + cookie canary_token 自动路由到对应后端
    # cookie canary_token=canary → canary_backend，否则 → stable_backend
    location / {
        proxy_pass http://$canary_backend;

        proxy_http_version 1.1;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 转发真实客户端 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 灰度标识头（传递给后端）
        proxy_set_header X-Canary-Version $cookie_canary_token;

        # 超时配置（WebSocket 长连接需要更长超时）
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ===== 静态资源路由 =====
    location /static/ {
        proxy_pass http://stable_backend/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 健康检查（不走认证，直接到 stable）=====
    location = /api/health {
        proxy_pass http://stable_backend/api/health;
        access_log off;
    }

    # ===== 灰度控制端点 =====
    location = /api/canary {
        # 仅允许内网访问
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        # 返回 canary 状态信息
        return 200 '{"canary": "enabled", "cookie": "$cookie_canary_token"}';
        add_header Content-Type application/json;
    }
}
