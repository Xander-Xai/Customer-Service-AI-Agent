# 敏感配置示例（Secret）——只能使用 PLACEHOLDER，绝不能提交真实 key。
#
# 用法：
#   cp deploy/k8s/secret.example.yaml deploy/k8s/secret.yaml   # secret.yaml 已 gitignore
#   编辑 secret.yaml，把所有 REPLACE_ME_* / CHANGE_ME_* 换成真实值
#   kubectl apply -f deploy/k8s/secret.yaml
#
# 注意：core/config.py 的生产校验会拒绝占位符（sk-placeholder / change-me 等），
# 未替换时 API/worker 会 fail fast，不会带假密钥启动。
apiVersion: v1
kind: Secret
metadata:
  name: customer-ai-secrets
  namespace: customer-ai
  labels:
    app.kubernetes.io/name: customer-ai-agent
type: Opaque
stringData:
  # ---- LLM / Embedding / Reranker ----
  OPENAI_API_KEY: "sk-placeholder-replace-me"
  EMBEDDING_API_KEY: "REPLACE_ME_EMBEDDING_API_KEY"
  RERANKER_API_KEY: "REPLACE_ME_RERANKER_API_KEY"
  # ---- 数据库 / 缓存（生产建议 managed/external service）----
  DATABASE_URL: "postgresql://csai:REPLACE_ME_DB_PASSWORD@postgres:5432/csai"
  REDIS_URL: "redis://:REPLACE_ME_REDIS_PASSWORD@redis:6379/0"
  # ---- 安全密钥（生产必须 >=32 随机字符；占位符会被启动校验拒绝）----
  JWT_SECRET: "change-me-replace-with-at-least-32-random-chars"
  SESSION_TOKEN_SECRET: "change-me-replace-with-at-least-32-random-chars"
  API_KEY: "REPLACE_ME_API_KEY"
  MONITORING_ADMIN_TOKEN: "REPLACE_ME_MONITORING_ADMIN_TOKEN"
  # ---- 可选 ----
  SESSION_ENCRYPTION_KEY: "REPLACE_ME_FERNET_KEY_OPTIONAL"
