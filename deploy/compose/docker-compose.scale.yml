# ===== 水平扩展覆盖配置（P2-2）=====
# 用法: docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --scale app=3
# 前提: SESSION_STORAGE_BACKEND=redis, DATABASE_URL=postgresql://...
version: '3.8'

services:
  app:
    environment:
      # 水平扩展必须使用 Redis 存储会话（内存模式无法跨实例共享）
      - SESSION_STORAGE_BACKEND=redis
      # 使用 PostgreSQL（SQLite 不支持多实例写入）
      - DATABASE_URL=${DATABASE_URL:-postgresql://csai:password@postgres:5432/csai}
      # 多副本共享 LangGraph checkpoint：必须 PostgreSQL，禁止进程内 MemorySaver
      - LANGGRAPH_CHECKPOINT_BACKEND=postgres
      - LANGGRAPH_CHECKPOINT_DATABASE_URL=${LANGGRAPH_CHECKPOINT_DATABASE_URL:-}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Worker 独立扩缩（与 API 解耦）：可单独增加执行并发/副本
  worker:
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://csai:password@postgres:5432/csai}
      - LANGGRAPH_CHECKPOINT_BACKEND=postgres
      - LANGGRAPH_CHECKPOINT_DATABASE_URL=${LANGGRAPH_CHECKPOINT_DATABASE_URL:-}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Nginx 负载均衡（多实例模式下替代单实例直连）
  nginx:
    volumes:
      - ../../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
