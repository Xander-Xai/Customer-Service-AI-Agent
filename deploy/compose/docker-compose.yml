version: '3.8'

services:
  # ===== Nginx 反向代理（v3.9）=====
  nginx:
    # 构建上下文 = deploy/nginx/（含 Dockerfile + nginx.conf）。
    # 路径锚点是**本文件所在目录** deploy/compose/，因此 `..` 即 deploy/。
    # 原值 `../../nginx` 解析到 <repo>/nginx —— 该目录不存在（真实位置是
    # deploy/nginx/），`docker compose build` 因此以
    # "unable to prepare context" 直接中止，make prod / 方式一 / 方式二 /
    # 生产运维手册 全部在第一步就被硬阻断（issue #48）。
    build: ../nginx
    container_name: customer-service-nginx
    # nginx 是生产栈**唯一**的应用入口：TLS、安全响应头、灰度流量分割都在这里。
    # app 只 expose 不 publish（见 app 服务），绕开 nginx 直连 8000 会同时丢掉
    # 这三层能力，所以 8000 不是生产可达地址。
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - cs-network

  # ===== 主应用服务 =====
  app:
    build: ../..
    container_name: customer-service-ai
    expose:
      - "8000"
    environment:
      # 进程角色：决定 core/config.py 施加哪一套校验（见 core/config.py::SERVICE_ROLE）。
      # API 需要 API_KEY / CORS / JWT / Session 密钥；worker 不需要。
      - SERVICE_ROLE=api
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.siliconflow.cn/v1}
      # Canonical default from core/config.py: Qwen/Qwen3-8B (see .env.example)
      - OPENAI_MODEL=${OPENAI_MODEL:-Qwen/Qwen3-8B}
      - ROUTING_COMPLEXITY_THRESHOLD=50
      - CACHE_L1_MAX=500
      - CACHE_L2_MAX=2000
      - CACHE_TTL=3600
      - SESSION_WINDOW_SIZE=10
      - SESSION_STORAGE_BACKEND=${SESSION_STORAGE_BACKEND:-redis}
      - HTTPX_MAX_CONNECTIONS=100
      - HTTPX_KEEPALIVE_CONNECTIONS=20
      - RETRY_MAX_ATTEMPTS=3
      - RETRY_BASE_DELAY=1.0
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/logs
      - LOG_FORMAT=${LOG_FORMAT:-text}
      # v3.9: CORS 从环境变量读取，支持多域名
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000}
      - API_KEY_ENABLED=${API_KEY_ENABLED:-true}
      - API_KEY=${API_KEY:-}
      - ERP_MODE=mock
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      # SLA 告警配置
      - SLA_ALERT_WINDOW=50
      - SLA_ALERT_THRESHOLD=30.0
      - SLA_ALERT_COOLDOWN=300
      # 熔断器配置
      - CIRCUIT_BREAKER_FAIL_THRESHOLD=5
      - CIRCUIT_BREAKER_RECOVERY_TIME=60
      # Recommended deployment value 8.0; runtime fallback in core/config.py is 4.0
      - LLM_ROUTER_TIMEOUT=${LLM_ROUTER_TIMEOUT:-8.0}
      # v3.4: 安全配置
      - MAX_QUERY_LENGTH=2000
      - MAX_SESSIONS=10000
      - SESSION_IDLE_TTL=3600
      # v3.7: 安全加固配置
      - MONITORING_ADMIN_TOKEN=${MONITORING_ADMIN_TOKEN:-}
      - WS_MAX_CONNECTIONS_PER_IP=${WS_MAX_CONNECTIONS_PER_IP:-5}
      - WS_MESSAGE_RATE_LIMIT=${WS_MESSAGE_RATE_LIMIT:-10}
      - WS_IDLE_TIMEOUT=${WS_IDLE_TIMEOUT:-300}
      - SESSION_TOKEN_SECRET=${SESSION_TOKEN_SECRET:-}
      - TLS_CERT_FILE=${TLS_CERT_FILE:-}
      - TLS_KEY_FILE=${TLS_KEY_FILE:-}
      # v3.9: Gunicorn 多 Worker
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_BIND=0.0.0.0:8000
      # P0-5: PostgreSQL 数据库连接（生产启用）
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET=${JWT_SECRET:-}
      # v6.0: Qdrant 向量数据库
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - VECTOR_DB_MODE=${VECTOR_DB_MODE:-qdrant_only}
      # LangGraph checkpoint（生产必须 postgres，跨 worker/副本共享）
      - LANGGRAPH_CHECKPOINT_BACKEND=${LANGGRAPH_CHECKPOINT_BACKEND:-postgres}
      - LANGGRAPH_CHECKPOINT_DATABASE_URL=${LANGGRAPH_CHECKPOINT_DATABASE_URL:-}
      # 异步 Agent Run（API 只创建+入队，执行在 worker）
      - AGENT_RUN_DISPATCH=${AGENT_RUN_DISPATCH:-celery}
      - AGENT_RUN_THREAD_LOCK_BACKEND=${AGENT_RUN_THREAD_LOCK_BACKEND:-redis}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-}
    volumes:
      - ../../chat_sessions:/app/chat_sessions
      - app-logs:/app/logs
      # v3.7: TLS 证书挂载（可选）
      - ${TLS_CERT_DIR:-/dev/null}:/app/certs:ro
      # v4.0: 数据库持久化
      - ../../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/health'); assert r.status_code==200"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cs-network

  # ===== Celery Worker（异步 Agent Run 执行）=====
  # 独立于 API 进程；API 关闭不影响已入队任务。业务状态真相源是 PostgreSQL，
  # Redis 仅作 broker（result backend 不启用）。
  worker:
    build: ../..
    container_name: customer-service-worker
    command: >
      celery -A runtime.celery_app:celery_app worker
      -Q ${AGENT_RUN_QUEUE:-agent_runs} -c ${WORKER_CONCURRENCY:-2}
      --loglevel=${WORKER_LOG_LEVEL:-info}
      --without-gossip --without-mingle
    environment:
      # 进程角色：worker 不终结 HTTP 请求，因此**不**需要 API_KEY / CORS_ORIGINS /
      # JWT_SECRET / SESSION_TOKEN_SECRET。缺少这些不再阻止 worker 启动
      # （core/config.py 按 SERVICE_ROLE 跳过 API 专属校验）。
      - SERVICE_ROLE=worker
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.siliconflow.cn/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-Qwen/Qwen3-8B}
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/logs
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - DATABASE_URL=${DATABASE_URL:-}
      - SESSION_STORAGE_BACKEND=${SESSION_STORAGE_BACKEND:-redis}
      - ERP_MODE=mock
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - VECTOR_DB_MODE=${VECTOR_DB_MODE:-qdrant_only}
      - LANGGRAPH_CHECKPOINT_BACKEND=${LANGGRAPH_CHECKPOINT_BACKEND:-postgres}
      - LANGGRAPH_CHECKPOINT_DATABASE_URL=${LANGGRAPH_CHECKPOINT_DATABASE_URL:-}
      # 执行模式：异步 Run 一律落库 + 入队（worker 自身就是消费方）
      - AGENT_EXECUTION_MODE=queued
      - AGENT_RUN_QUEUE=${AGENT_RUN_QUEUE:-agent_runs}
      - AGENT_RUN_THREAD_LOCK_ENABLED=true
      - AGENT_RUN_THREAD_LOCK_BACKEND=${AGENT_RUN_THREAD_LOCK_BACKEND:-redis}
      - AGENT_RUN_THREAD_LOCK_TTL_SECONDS=${AGENT_RUN_THREAD_LOCK_TTL_SECONDS:-300}
      - AGENT_RUN_LEASE_SECONDS=${AGENT_RUN_LEASE_SECONDS:-180}
      - AGENT_RUN_HEARTBEAT_SECONDS=${AGENT_RUN_HEARTBEAT_SECONDS:-30}
      - AGENT_RUN_MAX_ATTEMPTS=${AGENT_RUN_MAX_ATTEMPTS:-3}
      - AGENT_RUN_VISIBILITY_TIMEOUT=${AGENT_RUN_VISIBILITY_TIMEOUT:-3600}
      - LANGGRAPH_CHECKPOINT_POOL_MIN_SIZE=${LANGGRAPH_CHECKPOINT_POOL_MIN_SIZE:-1}
      - LANGGRAPH_CHECKPOINT_POOL_MAX_SIZE=${LANGGRAPH_CHECKPOINT_POOL_MAX_SIZE:-10}
      - LANGGRAPH_CHECKPOINT_SETUP_TIMEOUT=${LANGGRAPH_CHECKPOINT_SETUP_TIMEOUT:-15}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-}
      - CHECKPOINT_RETENTION_MIN_AGE_SECONDS=${CHECKPOINT_RETENTION_MIN_AGE_SECONDS:-86400}
    volumes:
      - app-logs:/app/logs
      - ../../data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    networks:
      - cs-network

  # ===== P0-5: PostgreSQL 数据库 =====
  postgres:
    image: postgres:15-alpine
    container_name: customer-service-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-csai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-csai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 生产环境不暴露主机端口，仅通过 Docker 网络访问
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cs-network

  # ===== Redis 服务（v3.4: 不暴露主机端口，仅限内部网络）=====
  redis:
    image: redis:7-alpine
    container_name: customer-service-redis
    # v3.4: 移除主机端口映射，仅通过 Docker 网络访问
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-changeme}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cs-network

  # ===== Prometheus 监控 =====
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: customer-service-prometheus
    expose:
      - "9090"
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/alert_rules.yml:/etc/prometheus/rules/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - cs-network

  # ===== Grafana 仪表盘 =====
  # NOTE: In production, Grafana should be proxied via Nginx rather than exposing the port directly
  grafana:
    image: grafana/grafana:10.4.1
    container_name: customer-service-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?请在 .env 中设置 GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - cs-network

  # ===== M5: Alertmanager 告警路由 =====
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: customer-service-alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ../../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped
    networks:
      - cs-network

  # ===== v6.0: Qdrant 向量数据库 =====
  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: customer-service-qdrant
    expose:
      - "6333"   # REST API
      - "6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    restart: unless-stopped
    networks:
      - cs-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  redis-data:
  app-logs:
  prometheus-data:
  grafana-data:
  postgres-data:
  alertmanager-data:
  qdrant_storage:
  qdrant_snapshots:

networks:
  cs-network:
    driver: bridge
