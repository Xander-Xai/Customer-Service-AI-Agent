# ===== 生产环境覆盖配置 =====
# 用法: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 或:   make prod
version: '3.8'

services:
  # ===== 主应用（生产模式：Gunicorn 多 Worker）=====
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODE: prod
    container_name: customer-service-ai-prod
    environment:
      - DEV_MODE=false
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - API_KEY_ENABLED=${API_KEY_ENABLED:-true}
      - SESSION_STORAGE_BACKEND=redis
      - ERP_MODE=${ERP_MODE:-mock}
    volumes:
      - ./chat_sessions:/app/chat_sessions
      - app-logs:/app/logs
      # v4.0: 数据库持久化
      - ./data:/app/data
    command: ["gunicorn", "api.app_factory:app", "-c", "gunicorn.conf.py"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ===== M4: Loki 日志聚合（生产环境默认启用）=====
  loki:
    image: grafana/loki:2.9.0
    container_name: customer-service-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    networks:
      - cs-network

  # ===== M4: Promtail 日志采集 =====
  promtail:
    image: grafana/promtail:2.9.0
    container_name: customer-service-promtail
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml:ro
      - app-logs:/app/logs:ro
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - cs-network

volumes:
  loki-data:
  promtail-positions:
