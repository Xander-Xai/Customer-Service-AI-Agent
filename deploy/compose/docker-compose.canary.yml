# Docker Compose for Canary Release (E4)
# 用法: docker compose -f docker-compose.yml -f docker-compose.canary.yml up -d
#
# 灰度发布配置：
# - 默认 90% 流量到 stable 服务
# - 10% 流量到 canary 服务（通过 canary_token cookie 控制）
# - canary 服务使用 CANARY=true 环境变量

version: '3.8'

services:
  # ===== Canary 服务（与 app 相同镜像，不同环境变量）=====
  canary:
    build: ../..
    container_name: customer-service-canary
    ports:
      - "${CANARY_PORT:-8001}:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.siliconflow.cn/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-Qwen/Qwen3-8B}
      - ROUTING_COMPLEXITY_THRESHOLD=50
      - CACHE_L1_MAX=500
      - CACHE_L2_MAX=2000
      - CACHE_TTL=3600
      - SESSION_WINDOW_SIZE=10
      - SESSION_STORAGE_BACKEND=${SESSION_STORAGE_BACKEND:-memory}
      - HTTPX_MAX_CONNECTIONS=100
      - HTTPX_KEEPALIVE_CONNECTIONS=20
      - RETRY_MAX_ATTEMPTS=3
      - RETRY_BASE_DELAY=1.0
      - LOG_LEVEL=INFO
      - LOG_DIR=/app/logs
      - LOG_FORMAT=json
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000}
      - API_KEY_ENABLED=${API_KEY_ENABLED:-true}
      - API_KEY=${API_KEY:-}
      - ERP_MODE=mock
      - REDIS_URL=redis://redis:6379
      # 灰度标识
      - CANARY=true
      - CANARY_VERSION=${CANARY_VERSION:-latest}
      # 其他配置继承 stable
      - MAX_QUERY_LENGTH=2000
      - MAX_SESSIONS=10000
      - SESSION_IDLE_TTL=3600
      - MONITORING_ADMIN_TOKEN=${MONITORING_ADMIN_TOKEN:-}
      - SESSION_TOKEN_SECRET=${SESSION_TOKEN_SECRET:-}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_BIND=0.0.0.0:8000
    volumes:
      - ../../chat_sessions:/app/chat_sessions
      - canary-logs:/app/logs
      - ${TLS_CERT_DIR:-/dev/null}:/app/certs:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/health'); assert r.status_code==200"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cs-network

  # ===== Nginx 配置更新（灰度流量分割）=====
  nginx:
    volumes:
      - ../../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../deploy/nginx/ssl:/etc/nginx/ssl:ro

volumes:
  canary-logs:

networks:
  cs-network:
    driver: bridge
