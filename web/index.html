<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>药妆智多星 - 智能客服系统</title>
  <script>
    (() => {
      try {
        const pref = JSON.parse(localStorage.getItem('user-prefs') || '{}');
        const html = document.documentElement;
        if (pref.themeLight) html.dataset.themeLight = pref.themeLight;
        if (pref.colorMode && pref.colorMode !== 'system') html.dataset.colorMode = pref.colorMode;
        if (pref.themeDark) html.dataset.themeDark = pref.themeDark;
        if (pref.fontSize) html.dataset.fontSize = pref.fontSize;
        if (pref.lineHeight) html.dataset.lineHeight = pref.lineHeight;
        if (pref.motion) html.dataset.motion = pref.motion;
      } catch(_e) {}
    })();
  </script>
</head>
<body>
  <!-- 跳转链接（无障碍） -->
  <a href="#chatInput" class="skip-link">跳到内容</a>

  <!-- 顶部导航 -->
  <header class="nav-header" aria-label="主导航">
    <div class="nav-logo">
      <div class="nav-logo-icon">🤖</div>
      <span class="nav-logo-text">药妆智多星</span>
      <span class="nav-logo-version">v6.0</span>
    </div>
    <button type="button" class="nav-menu-btn" id="navMenuBtn" aria-label="打开菜单">☰</button>
    <nav class="nav-links" aria-label="页面导航">
      <button type="button" class="nav-link active">
        💬 对话
      </button>
    </nav>
    <div class="nav-status">
      <div class="status-indicator">
        <span class="status-dot" id="wsStatusDot"></span>
        <span id="wsStatusText">连接中...</span>
      </div>
      <span id="userInfo"></span>
      <a href="/admin.html" id="adminLink">⚙️ 管理</a>
      <button type="button" class="btn-settings" id="btnSettings" aria-label="打开偏好设置" title="偏好设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button type="button" id="logoutBtn">退出</button>
    </div>
  </header>

  <!-- 主布局 -->
  <div class="app-layout" id="chatPage">
    <!-- 侧边栏：会话历史 -->
    <aside class="sidebar" aria-label="会话历史">
      <div class="sidebar-header">
        <div class="sidebar-title">会话历史</div>
        <button type="button" class="btn-new-chat" id="btnNewChat">
          ＋ 新建对话
        </button>
      </div>
      <div class="sidebar-search">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索当前消息..." aria-label="搜索消息">
      </div>
      <div class="session-list" id="sessionList">
        <!-- 动态填充 -->
      </div>
    </aside>

    <!-- 侧边栏遮罩（移动端） -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- 聊天主区域 -->
    <main class="chat-area">
      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="对话消息">
        <!-- 欢迎界面（由 JS 动态渲染） -->
      </div>

      <!-- 输入区域 -->
      <div class="chat-input-area">
        <div class="image-preview-area" id="imagePreviewArea">
          <div class="image-preview-container">
            <img class="image-preview-thumb" id="imagePreviewThumb" src="" alt="预览">
            <div class="image-preview-info">
              <span class="image-preview-name" id="imagePreviewName"></span>
              <span class="image-preview-size" id="imagePreviewSize"></span>
            </div>
            <button type="button" class="image-preview-remove" id="imagePreviewRemove" title="移除图片" aria-label="移除图片">✕</button>
          </div>
        </div>
        <div class="chat-input-wrapper" id="chatInputWrapper">
          <button type="button" class="btn-attach" id="btnAttach" title="上传文件" aria-label="上传文件">
            📎
          </button>
          <button type="button" class="btn-voice" id="btnVoice" title="语音输入" aria-label="语音输入">
            🎤
          </button>
          <textarea
            class="chat-input"
            id="chatInput"
            placeholder="输入您的问题..."
            rows="1"
            aria-label="输入消息"
            aria-describedby="inputHint"
          ></textarea>
          <button type="button" class="btn-send" id="btnSend" disabled aria-label="发送消息">
            ➤
          </button>
        </div>
        <div class="input-hint" id="inputHint">按 Enter 发送，Shift + Enter 换行 · 支持图片/文档/视频上传 · <span class="input-help-hint" id="btnShortcuts">快捷键 <kbd>?</kbd></span></div>
        <div class="tts-selector" id="ttsSelectorContainer">
          <label for="selectTTSVoice" class="tts-label">🔊 语音：</label>
          <select id="selectTTSVoice" class="tts-voice-select" aria-label="选择 TTS 语音">
            <option value="">加载中...</option>
          </select>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,video/*,.pdf,.docx,.doc,.txt,.md" class="sr-only" title="上传文件" aria-label="上传文件">
      </div>
    </main>
  </div>

  <!-- 会话详情侧面板 -->
  <div class="session-detail-panel" id="sessionDetailPanel" role="dialog" aria-modal="false" aria-label="会话详情">
    <div class="panel-header">
      <span class="panel-title">会话详情</span>
      <button type="button" class="panel-close" id="btnClosePanel" aria-label="关闭面板">✕</button>
    </div>
    <div id="sessionDetailContent" class="panel-content"></div>
  </div>

  <!-- 快捷键帮助弹窗 -->
  <div class="shortcuts-overlay" id="shortcutsOverlay" role="dialog" aria-modal="true" aria-label="键盘快捷键">
    <div class="shortcuts-modal">
      <h3>⌨️ 键盘快捷键</h3>
      <div class="shortcut-row"><span class="shortcut-desc">发送消息</span><span class="shortcut-key"><kbd>Enter</kbd></span></div>
      <div class="shortcut-row"><span class="shortcut-desc">换行</span><span class="shortcut-key"><kbd>Shift</kbd> + <kbd>Enter</kbd></span></div>
      <div class="shortcut-row"><span class="shortcut-desc">聚焦输入框</span><span class="shortcut-key"><kbd>/</kbd></span></div>
      <div class="shortcut-row"><span class="shortcut-desc">新建对话</span><span class="shortcut-key"><kbd>Ctrl</kbd> + <kbd>N</kbd></span></div>
      <div class="shortcut-row"><span class="shortcut-desc">显示/关闭此帮助</span><span class="shortcut-key"><kbd>?</kbd></span></div>
      <div class="shortcut-row"><span class="shortcut-desc">关闭弹窗</span><span class="shortcut-key"><kbd>Esc</kbd></span></div>
    </div>
  </div>

  <!-- 偏好设置面板 -->
  <div class="settings-panel" id="settingsPanel" role="dialog" aria-modal="true" aria-label="偏好设置" aria-hidden="true">
    <div class="settings-backdrop" id="settingsBackdrop"></div>
    <aside class="settings-drawer">
      <div class="settings-header">
        <h2>⚙️ 偏好设置</h2>
        <button type="button" class="settings-close" id="btnSettingsClose" aria-label="关闭">✕</button>
      </div>
      <div class="settings-body">
        <fieldset class="settings-group">
          <legend>外观（浅色主题）</legend>
          <div class="theme-light-grid">
            <label class="theme-option"><input type="radio" name="themeLight" value="pure"><span>纯白简洁</span></label>
            <label class="theme-option"><input type="radio" name="themeLight" value="warm" checked><span>暖骨白 ⭐</span></label>
            <label class="theme-option"><input type="radio" name="themeLight" value="soft"><span>柔和灰</span></label>
            <label class="theme-option"><input type="radio" name="themeLight" value="cream"><span>奶油米</span></label>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>颜色模式</legend>
          <div class="seg-control" data-key="colorMode">
            <button type="button" data-value="light" aria-pressed="false">浅色</button>
            <button type="button" data-value="dark" aria-pressed="false">深色</button>
            <button type="button" data-value="system" aria-pressed="true">跟随系统</button>
          </div>
        </fieldset>

        <fieldset class="settings-group" data-show-when="dark">
          <legend>深色主题</legend>
          <div class="theme-dark-grid">
            <label class="theme-option"><input type="radio" name="themeDark" value="classic" checked><span>经典深色</span></label>
            <label class="theme-option"><input type="radio" name="themeDark" value="warm"><span>暖调深色</span></label>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>字号</legend>
          <div class="seg-control" data-key="fontSize">
            <button type="button" data-value="small" aria-pressed="false">小</button>
            <button type="button" data-value="medium" aria-pressed="true">中</button>
            <button type="button" data-value="large" aria-pressed="false">大</button>
            <button type="button" data-value="xlarge" aria-pressed="false">超大</button>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>行高</legend>
          <div class="seg-control" data-key="lineHeight">
            <button type="button" data-value="compact" aria-pressed="false">紧凑</button>
            <button type="button" data-value="standard" aria-pressed="true">标准</button>
            <button type="button" data-value="relaxed" aria-pressed="false">宽松</button>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>动画</legend>
          <div class="switch-row">
            <label for="switchMotion">减少动画</label>
            <input type="checkbox" id="switchMotion" role="switch" aria-checked="false">
          </div>
        </fieldset>
      </div>
      <div class="settings-footer">
        <button type="button" class="btn-reset" id="btnResetPrefs">恢复默认设置</button>
      </div>
    </aside>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
