<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>药妆智多星 - 智能客服系统</title>
</head>
<body>
  <!-- 跳转链接（无障碍） -->
  <a href="#chatInput" class="skip-link">跳到内容</a>

  <!-- 顶部导航 -->
  <header class="nav-header" aria-label="主导航">
    <div class="nav-logo">
      <div class="nav-logo-icon">🤖</div>
      <span class="nav-logo-text">药妆智多星</span>
      <span class="nav-logo-version">v5.0</span>
    </div>
    <button type="button" class="nav-menu-btn" id="navMenuBtn" aria-label="打开菜单" style="display:none;background:none;border:none;color:var(--text-primary);font-size:20px;cursor:pointer;padding:4px 8px">☰</button>
    <nav class="nav-links" aria-label="页面导航">
      <button type="button" class="nav-link active" data-page="chat">
        💬 对话
      </button>
    </nav>
    <div class="nav-status">
      <div class="status-indicator">
        <span class="status-dot" id="wsStatusDot"></span>
        <span id="wsStatusText">连接中...</span>
      </div>
      <span id="userInfo"></span>
      <a href="/admin.html" id="adminLink">⚙️ 管理</a>
      <button type="button" id="logoutBtn">退出</button>
    </div>
  </header>

  <!-- 主布局 -->
  <div class="app-layout" id="chatPage">
    <!-- 侧边栏：会话历史 -->
    <aside class="sidebar" aria-label="会话历史">
      <div class="sidebar-header">
        <div class="sidebar-title">会话历史</div>
        <button type="button" class="btn-new-chat" id="btnNewChat">
          ＋ 新建对话
        </button>
      </div>
      <div class="sidebar-search">
        <input type="text" class="search-input" id="searchInput" placeholder="搜索当前消息..." aria-label="搜索消息">
      </div>
      <div class="session-list" id="sessionList">
        <!-- 动态填充 -->
      </div>
    </aside>

    <!-- 侧边栏遮罩（移动端） -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- 聊天主区域 -->
    <main class="chat-area">
      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="对话消息">
        <!-- 欢迎界面（由 JS 动态渲染） -->
      </div>

      <!-- 输入区域 -->
      <div class="chat-input-area">
        <div class="image-preview-area" id="imagePreviewArea" style="display:none">
          <div class="image-preview-container">
            <img class="image-preview-thumb" id="imagePreviewThumb" src="" alt="预览">
            <div class="image-preview-info">
              <span class="image-preview-name" id="imagePreviewName"></span>
              <span class="image-preview-size" id="imagePreviewSize"></span>
            </div>
            <button type="button" class="image-preview-remove" id="imagePreviewRemove" title="移除图片" aria-label="移除图片">✕</button>
          </div>
        </div>
        <div class="chat-input-wrapper" id="chatInputWrapper">
          <button type="button" class="btn-attach" id="btnAttach" title="上传文件" aria-label="上传文件">
            📎
          </button>
          <button type="button" class="btn-voice" id="btnVoice" title="语音输入" aria-label="语音输入">
            🎤
          </button>
          <textarea
            class="chat-input"
            id="chatInput"
            placeholder="输入您的问题..."
            rows="1"
            aria-label="输入消息"
            aria-describedby="inputHint"
          ></textarea>
          <button type="button" class="btn-send" id="btnSend" disabled aria-label="发送消息">
            ➤
          </button>
        </div>
        <div class="input-hint" id="inputHint">按 Enter 发送，Shift + Enter 换行 · 支持图片/文档/视频上传 · <span class="input-help-hint" id="btnShortcuts">快捷键 <kbd>?</kbd></span></div>
        <div class="tts-selector" id="ttsSelectorContainer">
          <label for="selectTTSVoice" class="tts-label">🔊 语音：</label>
          <select id="selectTTSVoice" class="tts-voice-select" aria-label="选择 TTS 语音">
            <option value="">加载中...</option>
          </select>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,video/*,.pdf,.docx,.doc,.txt,.md" style="display:none">
      </div>
    </main>
  </div>

  <!-- 会话详情侧面板 -->
  <div class="session-detail-panel" id="sessionDetailPanel" role="dialog" aria-modal="false" aria-label="会话详情">
    <div class="panel-header">
      <span style="font-weight:600">会话详情</span>
      <button type="button" class="panel-close" id="btnClosePanel" aria-label="关闭面板">✕</button>
    </div>
    <div id="sessionDetailContent" style="padding:16px"></div>
  </div>

  <!-- 快捷键帮助弹窗 -->
  <div class="shortcuts-overlay" id="shortcutsOverlay" role="dialog" aria-modal="true" aria-label="键盘快捷键">
    <div class="shortcuts-modal">
      <h3>⌨️ 键盘快捷键</h3>
      <div class="shortcut-row"><span class="shortcut-desc">发送消息</span><span class="shortcut-key"><kbd>Enter</kbd></span></div>
      <div class="shortcut-row"><span class="shortcut-desc">换行</span><span class="shortcut-key"><kbd>Shift</kbd> + <kbd>Enter</kbd></span></div>
      <div class="shortcut-row"><span class="shortcut-desc">聚焦输入框</span><span class="shortcut-key"><kbd>/</kbd></span></div>
      <div class="shortcut-row"><span class="shortcut-desc">新建对话</span><span class="shortcut-key"><kbd>Ctrl</kbd> + <kbd>N</kbd></span></div>
      <div class="shortcut-row"><span class="shortcut-desc">显示/关闭此帮助</span><span class="shortcut-key"><kbd>?</kbd></span></div>
      <div class="shortcut-row"><span class="shortcut-desc">关闭弹窗</span><span class="shortcut-key"><kbd>Esc</kbd></span></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
