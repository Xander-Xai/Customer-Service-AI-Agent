<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta charset="UTF-8">
  <meta name="description" content="药妆智多星登录 - 多智能体客服系统">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)">
  <script>
    (() => {
      try {
        const pref = JSON.parse(localStorage.getItem('user-prefs') || '{}');
        const html = document.documentElement;
        if (pref.themeLight) html.dataset.themeLight = pref.themeLight;
        if (pref.colorMode && pref.colorMode !== 'system') html.dataset.colorMode = pref.colorMode;
        if (pref.themeDark) html.dataset.themeDark = pref.themeDark;
        if (pref.fontSize) html.dataset.fontSize = pref.fontSize;
        if (pref.lineHeight) html.dataset.lineHeight = pref.lineHeight;
        if (pref.motion) html.dataset.motion = pref.motion;
      } catch(_e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 药妆智多星</title>
  <link rel="stylesheet" href="/styles/login.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card" style="position:relative">

    <button type="button" class="btn-settings login-settings" id="btnSettings" aria-label="打开偏好设置" title="偏好设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
      <div class="login-header">
        <div class="login-logo">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
            <path d="M24 4L42 14V34L24 44L6 34V14L24 4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M24 18V30M18 24H30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="login-title">药妆智多星</div>
        <div class="login-subtitle" id="formTitle">智能客服系统 · 登录</div>
      </div>

      <form id="authForm">
        <div class="form-group" id="displayNameGroup" style="display:none">
          <label for="displayName" class="form-label">显示名称</label>
          <input class="form-input" id="displayName" placeholder="您的名字（选填）" maxlength="64">
        </div>
        <div class="form-group">
          <label for="username" class="form-label">用户名</label>
          <input class="form-input" id="username" placeholder="请输入用户名" required maxlength="32" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password" class="form-label">密码</label>
          <input class="form-input" id="password" type="password" placeholder="请输入密码" required maxlength="64" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="submitBtn" type="submit">登录</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>

      <div class="switch-mode">
        <span id="switchText">没有账号？</span>
        <a id="switchLink">注册</a>
      </div>

      <div class="demo-hint" id="demoHint">
        测试账号：<code>admin</code> / <code>admin123</code>
      </div>
    </div>
  </div>


  <!-- 偏好设置面板 -->
  <div class="settings-panel" id="settingsPanel" role="dialog" aria-modal="true" aria-label="偏好设置" aria-hidden="true">
    <div class="settings-backdrop" id="settingsBackdrop"></div>
    <aside class="settings-drawer">
      <div class="settings-header">
        <h2>⚙️ 偏好设置</h2>
        <button type="button" class="settings-close" id="btnSettingsClose" aria-label="关闭">✕</button>
      </div>
      <div class="settings-body">
        <fieldset class="settings-group">
          <legend>外观（浅色主题）</legend>
          <div class="theme-light-grid">
            <label class="theme-option"><input type="radio" name="themeLight" value="pure"><span>纯白简洁</span></label>
            <label class="theme-option"><input type="radio" name="themeLight" value="warm" checked><span>暖骨白 ⭐</span></label>
            <label class="theme-option"><input type="radio" name="themeLight" value="soft"><span>柔和灰</span></label>
            <label class="theme-option"><input type="radio" name="themeLight" value="cream"><span>奶油米</span></label>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>颜色模式</legend>
          <div class="seg-control" data-key="colorMode">
            <button type="button" data-value="light" aria-pressed="false">浅色</button>
            <button type="button" data-value="dark" aria-pressed="false">深色</button>
            <button type="button" data-value="system" aria-pressed="true">跟随系统</button>
          </div>
        </fieldset>

        <fieldset class="settings-group" data-show-when="dark">
          <legend>深色主题</legend>
          <div class="theme-dark-grid">
            <label class="theme-option"><input type="radio" name="themeDark" value="classic" checked><span>经典深色</span></label>
            <label class="theme-option"><input type="radio" name="themeDark" value="warm"><span>暖调深色</span></label>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>字号</legend>
          <div class="seg-control" data-key="fontSize">
            <button type="button" data-value="small" aria-pressed="false">小</button>
            <button type="button" data-value="medium" aria-pressed="true">中</button>
            <button type="button" data-value="large" aria-pressed="false">大</button>
            <button type="button" data-value="xlarge" aria-pressed="false">超大</button>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>行高</legend>
          <div class="seg-control" data-key="lineHeight">
            <button type="button" data-value="compact" aria-pressed="false">紧凑</button>
            <button type="button" data-value="standard" aria-pressed="true">标准</button>
            <button type="button" data-value="relaxed" aria-pressed="false">宽松</button>
          </div>
        </fieldset>

        <fieldset class="settings-group">
          <legend>动画</legend>
          <div class="switch-row">
            <label for="switchMotion">减少动画</label>
            <input type="checkbox" id="switchMotion" role="switch" aria-checked="false">
          </div>
        </fieldset>
      </div>
      <div class="settings-footer">
        <button type="button" class="btn-reset" id="btnResetPrefs">恢复默认设置</button>
      </div>
    </aside>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
