# Docker Compose for Loki Log Aggregation (E2)
# 用法: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d

version: '3.8'

services:
  # ===== Loki 日志聚合 =====
  loki:
    image: grafana/loki:2.9.0
    container_name: customer-service-loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cs-network

  # ===== Promtail 日志采集 =====
  promtail:
    image: grafana/promtail:2.9.0
    container_name: customer-service-promtail
    volumes:
      - ./loki/promtail-config.yaml:/etc/promtail/config.yml:ro
      - app-logs:/app/logs:ro
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - cs-network

volumes:
  loki-data:
  promtail-positions:

networks:
  cs-network:
    driver: bridge
