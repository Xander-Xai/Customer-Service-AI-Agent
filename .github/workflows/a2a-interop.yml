name: A2A 1.0 Optional SDK Interoperability

on:
  pull_request:
    paths:
      - "integrations/a2a_policy/**"
      - "integrations/__init__.py"
      - "tools/a2a_policy_client.py"
      - "tests/unit/test_a2a_contract.py"
      - "tests/integration/test_a2a_sdk_interop.py"
      - "requirements-a2a.txt"
      - ".github/workflows/a2a-interop.yml"
      - "core/container.py"
  push:
    branches: [main]
    paths:
      - "integrations/a2a_policy/**"
      - "tools/a2a_policy_client.py"
      - "tests/unit/test_a2a_contract.py"
      - "tests/integration/test_a2a_sdk_interop.py"
      - "requirements-a2a.txt"
      - ".github/workflows/a2a-interop.yml"
      - "core/container.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2a-interop:
    name: A2A SDK 1.0 contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install only optional A2A integration deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-a2a.txt "pytest==8.4.2" "pytest-asyncio==0.23.8"
      - name: Exercise SDK-to-SDK Agent Card, auth and message/task round trip
        run: |
          python -m pytest -q tests/unit/test_a2a_contract.py tests/integration/test_a2a_sdk_interop.py -o addopts=''
