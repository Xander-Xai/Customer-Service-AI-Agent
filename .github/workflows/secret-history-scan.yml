name: Historical secret scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan reachable git history (credentials)
        run: python scripts/check_secrets.py --history

      # Exit code 2 means "known residue", not "new leak": retired career
      # material and the old internal product codename are still reachable in
      # published history until an authorised rewrite happens. See
      # DATA_PROVENANCE.md §4 — this job is the periodic inventory of that risk.
      - name: Scan reachable git history (public boundary)
        continue-on-error: true
        run: python scripts/check_public_repository_boundary.py --history
