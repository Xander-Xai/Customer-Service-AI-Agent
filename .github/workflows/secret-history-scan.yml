name: Historical secret scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan reachable git history (credentials)
        run: python scripts/check_secrets.py --history --new-only

      # The baseline snapshot covers reviewed legacy history. Unlike the full
      # inventory mode, --new-only rejects newly reachable violations and does
      # not silence future regressions with continue-on-error.
      - name: Scan newly reachable git history (public boundary)
        run: python scripts/check_public_repository_boundary.py --history --new-only
