name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup test environment
        run: |
          cp .env.test .env
          echo "✅ .env.test → .env 已复制"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install argon2-cffi  # 确保 Argon2id 可用 (OS-level dep conflict)
          # P0-01 AC8 reproducibility: the ENTIRE coverage toolchain is pinned,
          # not just pytest/pytest-asyncio. pytest-cov and coverage are what
          # actually compute the coverage number — leaving them floating made
          # the gate irreproducible (78.08% / 78.65% / 78.72% were three
          # different toolchains: local pytest 8.4.2 vs CI 7.4.4, and
          # coverage floating between 7.4.4 and 7.14.x). A contract test
          # (test_install_step_pins_full_coverage_toolchain) enforces that all
          # four packages stay pinned.
          pip install pytest==7.4.4 pytest-asyncio==0.21.1 pytest-cov==5.0.0 coverage==7.4.4

      - name: Debug - Check Python and packages
        run: |
          python --version
          pip list | grep -E "pytest|asyncio"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short --ignore=tests/e2e/test_e2e_real_llm.py --cache-clear

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short -m "not real_llm" --cache-clear

      - name: Run e2e tests (mock LLM)
        run: |
          python -m pytest tests/e2e/ -v --tb=short -m "not real_llm" --ignore=tests/e2e/test_e2e_real_llm.py --cache-clear

      - name: Run stress tests
        run: |
          python -m pytest tests/stress/ -v --tb=short --cache-clear

      # Lane classification (P0-01 Required Change #4):
      # - real_llm: informational (excluded via `-m "not real_llm"`; needs OPENAI_API_KEY)
      # - stress: blocking (runs in CI; make informational only if it becomes flaky)
      # - unit / integration / e2e(mock): blocking
      - name: Run coverage report
        # `set -o pipefail` makes the `| tail` display-layer only: pytest's exit
        # code (incl. coverage.py's `fail_under=80` gate) propagates instead of
        # being masked by tail's success. Without it a shell override (sh/cmd/
        # pwsh) or running outside GitHub Actions would silently false-green.
        # `--junit-xml` emits a machine-readable JUnit report (passed/failed/
        # skipped/executed); the local `-p pytest_counts` plugin writes a
        # pytest-counts.json sidecar with the `collected`/`deselected` counts
        # that JUnit does not record (AC4: report must distinguish passed,
        # collected, skipped, failed). PYTHONPATH=scripts makes the plugin
        # importable without a dependency.
        # `--cov` (no path) measures ONLY the modules in pyproject.toml's
        # `[tool.coverage.run] source = [...]` (business code), NOT `.` which
        # would also measure tests/* — restoring the project's original coverage
        # scope. coverage 7.4.4's `omit = ["tests/*"]` is not reliably applied
        # under `--cov=.`, so `--cov` + the explicit source list is the robust
        # form (AC8 scope consistency).
        # IMPORTANT: `--cov` (no path) is NOT reliable either — coverage 7.4.4
        # then measures every imported file (sitecustomize.py, chardet/*,
        # _pytest/*, scripts/*) because the `source` config is not consistently
        # honored. The ONLY form proven to scope to business modules is EXPLICIT
        # `--cov=<dir>` for every source directory. This is verified by the
        # contract test test_cov_command_lists_all_source_dirs + a scope
        # assertion test in test_ci_summary.py that runs coverage and checks the
        # XML contains no system/third-party files.
        env:
          PYTHONPATH: scripts
          PYTEST_COUNTS_FILE: pytest-counts.json
          # AC8 reproducibility: record the EXACT pytest command run below so
          # ci_summary can surface it in the provenance line — a coverage figure
          # is only meaningful if the command (and toolchain, captured separately
          # via importlib.metadata versions) that produced it is recorded. This
          # must stay byte-identical to the `python -m pytest …` line in `run:`
          # below (minus the `2>&1 | tail` display layer, which is not part of
          # the pytest invocation). A contract test
          # (test_invocation_matches_run_command) enforces the two stay in sync.
          PYTEST_INVOCATION: >-
            python -m pytest tests/unit/ tests/integration/ tests/e2e/ -v --tb=short --cov=agents --cov=alerts --cov=api --cov=auth --cov=cache --cov=collaboration --cov=core --cov=db --cov=erp --cov=knowledge --cov=llm --cov=media --cov=rag --cov=router --cov=tools --cov-report=term-missing --cov-report=html --cov-report=xml --junit-xml=pytest-report.xml -p pytest_counts -m "not real_llm and not stress" --ignore=tests/e2e/test_e2e_real_llm.py --cache-clear
        run: |
          set -o pipefail
          python -m pytest tests/unit/ tests/integration/ tests/e2e/ -v --tb=short --cov=agents --cov=alerts --cov=api --cov=auth --cov=cache --cov=collaboration --cov=core --cov=db --cov=erp --cov=knowledge --cov=llm --cov=media --cov=rag --cov=router --cov=tools --cov-report=term-missing --cov-report=html --cov-report=xml --junit-xml=pytest-report.xml -p pytest_counts -m "not real_llm and not stress" --ignore=tests/e2e/test_e2e_real_llm.py --cache-clear 2>&1 | tail -30

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
            pytest-report.xml
            pytest-counts.json
          retention-days: 14

      # Machine-readable test & coverage summary (P0-01 Required Change #5 / AC4).
      # ci_summary.py parses pytest-report.xml (JUnit: passed/failed/skipped/
      # executed), pytest-counts.json (collected/deselected), and coverage.xml
      # (coverage % + gate), surfacing all to the job/PR summary with a
      # provenance line (Python version + git SHA). Informational: never fails
      # the job (the blocking gates live in the pytest/coverage steps).
      - name: Test and coverage summary
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci_summary.py pytest-report.xml coverage.xml pytest-counts.json >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          set -o pipefail
          echo "=== Test Summary ==="
          python -m pytest tests/ --co -q 2>&1 | tail -5

  # P2-5: 安全扫描
  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit mypy
          pip install -r requirements.txt

      - name: Type checking — strict (new modules)
        run: |
          python -m mypy core/protocols.py core/token_tracker.py core/prompt_manager.py rag/reranker.py rag/query_rewriter.py api/dependencies.py api/routes/prompts.py --ignore-missing-imports --follow-imports=skip

      - name: Type checking — gradual (existing modules)
        continue-on-error: true
        run: |
          python -m mypy agents/ cache/ collaboration/ core/ rag/ router/ tools/ api/ auth/ db/ erp/ knowledge/ session_manager.py token_counter.py drift_detector.py --ignore-missing-imports

      # pip-audit is informational: a finding surfaces as a ⚠️ step result
      # (visible in the run UI) but does not block the job. `continue-on-error`
      # replaces the old `|| true`, which hid findings behind a green check.
      # To make dependency vulnerabilities blocking, drop continue-on-error.
      - name: Dependency vulnerability scan (pip-audit)
        continue-on-error: true
        run: |
          pip-audit --requirement requirements.txt --desc

      - name: Static security analysis (bandit)
        run: |
          bandit -r agents/ api/ auth/ cache/ collaboration/ core/ db/ erp/ knowledge/ rag/ router/ session_manager.py tools/ -ll --skip B101

      - name: Check for secrets in code
        run: |
          python scripts/check_secrets.py
          # 检查是否有硬编码的 API Key 或密码
          ! grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" . || { echo "❌ 发现疑似硬编码 API Key"; exit 1; }
          ! grep -rn "password\s*=\s*['\"][^'\"]\{8,\}['\"]" --include="*.py" . | grep -v "test\|mock\|placeholder\|example\|your_\|change-me\|do-not-use\|admin123\|test_" || { echo "❌ 发现疑似硬编码密码"; exit 1; }

  # ===== Docker 镜像构建（main 分支 + tag）=====
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_MODE=prod

  # ===== 部署到生产环境（需手动审批 + 服务器密钥）=====
  # 需在 GitHub Settings > Variables 配置 DEPLOY_HOST 才会触发
  # 需在 GitHub Settings > Secrets 配置 DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && (vars.DEPLOY_HOST || '') != ''  # yamllint disable-line rule:truthy
    environment:
      name: production
      url: https://${{ vars.DEPLOY_HOST || 'localhost' }}  # yamllint disable-line rule:line-length
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}  # yamllint disable-line rule:line-length
          username: ${{ secrets.DEPLOY_USER }}  # yamllint disable-line rule:line-length
          key: ${{ secrets.DEPLOY_SSH_KEY }}  # yamllint disable-line rule:line-length
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/csai' }}  # yamllint disable-line rule:line-length
            git pull origin main
            cp .env.prod .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            # 等待健康检查
            sleep 10
            curl -sf http://localhost:8000/api/health || exit 1
            echo "✅ 部署完成"
