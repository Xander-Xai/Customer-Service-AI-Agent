name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==7.4.4 pytest-asyncio==0.21.1 pytest-cov

      - name: Debug - Check Python and packages
        run: |
          python --version
          pip list | grep -E "pytest|asyncio"

      - name: Run unit tests
        run: |
          python -m pytest tests/test_modules.py -v --tb=short

      - name: Run integration tests
        run: |
          python -m pytest tests/test_all.py -v --tb=short

      - name: Run mock LLM tests
        run: |
          python -m pytest tests/test_integration.py -v --tb=short

      - name: Run stress tests
        run: |
          python -m pytest tests/test_stress.py -v --tb=short

      - name: Summary
        if: always()
        run: |
          echo "=== Test Summary ==="
          python -m pytest tests/ --co -q 2>&1 | tail -5
