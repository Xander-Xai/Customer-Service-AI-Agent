name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup test environment
        run: |
          cp .env.test .env
          echo "✅ .env.test → .env 已复制"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==7.4.4 pytest-asyncio==0.21.1 pytest-cov

      - name: Debug - Check Python and packages
        run: |
          python --version
          pip list | grep -E "pytest|asyncio"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short --ignore=tests/e2e/test_e2e_real_llm.py

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short -m "not real_llm"

      - name: Run e2e tests (mock LLM)
        run: |
          python -m pytest tests/e2e/ -v --tb=short -m "not real_llm" --ignore=tests/e2e/test_e2e_real_llm.py

      - name: Run stress tests
        run: |
          python -m pytest tests/stress/ -v --tb=short

      - name: Run coverage report
        run: |
          python -m pytest tests/unit/ tests/integration/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=html --cov-report=xml -m "not real_llm and not stress" --ignore=tests/e2e/test_e2e_real_llm.py 2>&1 | tail -30

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "=== Test Summary ==="
          python -m pytest tests/ --co -q 2>&1 | tail -5

  # P2-5: 安全扫描
  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit mypy
          pip install -r requirements.txt

      - name: Type checking — strict (new modules)
        run: |
          python -m mypy core/protocols.py core/token_tracker.py core/prompt_manager.py rag/reranker.py rag/query_rewriter.py api/dependencies.py api/routes/prompts.py --ignore-missing-imports --follow-imports=skip

      - name: Type checking — gradual (existing modules)
        continue-on-error: true
        run: |
          python -m mypy agents/ cache/ collaboration/ core/ rag/ router/ tools/ api/ auth/ db/ erp/ knowledge/ session_manager.py token_counter.py drift_detector.py --ignore-missing-imports

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip-audit --requirement requirements.txt --desc || true

      - name: Static security analysis (bandit)
        run: |
          bandit -r agents/ api/ auth/ cache/ collaboration/ core/ db/ erp/ knowledge/ rag/ router/ session_manager.py tools/ -ll --skip B101

      - name: Check for secrets in code
        run: |
          # 检查是否有硬编码的 API Key 或密码
          ! grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" . || { echo "❌ 发现疑似硬编码 API Key"; exit 1; }
          ! grep -rn "password\s*=\s*['\"][^'\"]\{8,\}['\"]" --include="*.py" . | grep -v "test\|mock\|placeholder\|example\|your_\|change-me\|do-not-use\|admin123\|test_" || { echo "❌ 发现疑似硬编码密码"; exit 1; }

  # ===== Docker 镜像构建（main 分支 + tag）=====
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_MODE=prod

  # ===== 部署到生产环境（需手动审批 + 服务器密钥）=====
  # 需在 GitHub Settings > Variables 配置 DEPLOY_HOST 才会触发
  # 需在 GitHub Settings > Secrets 配置 DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && (vars.DEPLOY_HOST || '') != ''  # yamllint disable-line rule:truthy
    environment:
      name: production
      url: https://${{ vars.DEPLOY_HOST || 'localhost' }}  # yamllint disable-line rule:line-length
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}  # yamllint disable-line rule:line-length
          username: ${{ secrets.DEPLOY_USER }}  # yamllint disable-line rule:line-length
          key: ${{ secrets.DEPLOY_SSH_KEY }}  # yamllint disable-line rule:line-length
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/csai' }}  # yamllint disable-line rule:line-length
            git pull origin main
            cp .env.prod .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            # 等待健康检查
            sleep 10
            curl -sf http://localhost:8000/api/health || exit 1
            echo "✅ 部署完成"
