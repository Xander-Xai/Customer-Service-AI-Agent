name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint check (basic)
        run: |
          python -m py_compile config.py
          python -m py_compile session_manager.py
          python -m py_compile multi_agent_customer_service.py
          python -m py_compile agents/base_agent.py
          python -m py_compile core/monitoring.py
          python -m py_compile cache/response_cache.py
          python -m py_compile router/query_router.py
          python -m py_compile api/app.py

      - name: Run unit tests
        run: |
          python -m pytest tests/test_modules.py -v --tb=short

      - name: Run integration tests
        run: |
          python -m pytest tests/test_all.py -v --tb=short

      - name: Run mock LLM integration tests
        run: |
          python -m pytest tests/test_integration.py -v --tb=short

      - name: Run stress tests
        run: |
          python -m pytest tests/test_stress.py -v --tb=short -x

      - name: Generate coverage report
        run: |
          python -m pytest tests/test_modules.py tests/test_integration.py \
            --cov=. --cov-report=xml --cov-report=term-missing \
            --ignore=tests/test_stress.py

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t csai-agent:${{ github.sha }} .

      - name: Verify Docker image
        run: |
          docker run --rm -d --name test-container \
            -e API_KEY_ENABLED=false \
            -e OPENAI_API_KEY=test-key \
            csai-agent:${{ github.sha }}
          sleep 5
          docker exec test-container curl -sf http://localhost:8000/api/health || exit 1
          docker stop test-container
