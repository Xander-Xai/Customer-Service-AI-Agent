name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup test environment
        run: |
          cp .env.test .env
          echo "✅ .env.test → .env 已复制"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==7.4.4 pytest-asyncio==0.21.1 pytest-cov

      - name: Debug - Check Python and packages
        run: |
          python --version
          pip list | grep -E "pytest|asyncio"

      - name: Run unit tests
        run: |
          python -m pytest tests/test_modules.py -v --tb=short

      - name: Run integration tests
        run: |
          python -m pytest tests/test_all.py -v --tb=short

      - name: Run mock LLM tests
        run: |
          python -m pytest tests/test_integration.py -v --tb=short

      - name: Run stress tests
        run: |
          python -m pytest tests/test_stress.py -v --tb=short

      - name: Summary
        if: always()
        run: |
          echo "=== Test Summary ==="
          python -m pytest tests/ --co -q 2>&1 | tail -5

  # P2-5: 安全扫描
  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip-audit --requirement requirements.txt --desc || true

      - name: Static security analysis (bandit)
        run: |
          bandit -r agents/ api/ auth/ cache/ collaboration/ core/ db/ erp/ knowledge/ rag/ router/ session_manager.py tools/ -ll --skip B101

      - name: Check for secrets in code
        run: |
          # 检查是否有硬编码的 API Key 或密码
          ! grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" . || { echo "❌ 发现疑似硬编码 API Key"; exit 1; }
          ! grep -rn "password\s*=\s*['\"][^'\"]\{8,\}['\"]" --include="*.py" . | grep -v "test\|mock\|placeholder\|example\|your_\|change-me\|do-not-use\|admin123\|test_" || { echo "❌ 发现疑似硬编码密码"; exit 1; }

  # ===== Docker 镜像构建（main 分支 + tag）=====
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_MODE=prod

  # ===== 部署到生产环境（需手动审批 + 服务器密钥）=====
  # 需在 GitHub Settings > Variables 配置 DEPLOY_HOST 才会触发
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_HOST != ''
    environment:
      name: production
      url: https://${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/csai' }}
            git pull origin main
            cp .env.prod .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            # 等待健康检查
            sleep 10
            curl -sf http://localhost:8000/api/health || exit 1
            echo "✅ 部署完成"
