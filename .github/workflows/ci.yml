name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Setup test environment
        run: |
          cp .env.test .env
          echo "✅ .env.test → .env 已复制"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install argon2-cffi  # 确保 Argon2id 可用 (OS-level dep conflict)
          # LANE A — canonical coverage evidence toolchain (deliberately pinned;
          # do NOT float these to pytest 8). The committed coverage figure is
          # only reproducible against one toolchain. P0-01 AC8: the ENTIRE
          # coverage toolchain is pinned, not just pytest/pytest-asyncio.
          # pytest-cov and coverage are what actually compute the coverage
          # number — leaving them floating made the gate irreproducible
          # (78.08% / 78.65% / 78.72% were three different toolchains: local
          # pytest 8.4.2 vs CI 7.4.4, and coverage floating between 7.4.4 and
          # 7.14.x). A contract test
          # (test_install_step_pins_full_coverage_toolchain) enforces that all
          # four packages stay pinned. The supported pytest-8 compatibility
          # surface is exercised separately by the `dev-compat` job (LANE B,
          # requirements-dev.txt).
          pip install pytest==7.4.4 pytest-asyncio==0.21.1 pytest-cov==5.0.0 coverage==7.4.4

      - name: Debug - Check Python and packages
        run: |
          python --version
          pip list | grep -E "pytest|asyncio"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v --tb=short --ignore=tests/e2e/test_e2e_real_llm.py --cache-clear

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v --tb=short -m "not real_llm" --cache-clear

      - name: Run e2e tests (mock LLM)
        run: |
          python -m pytest tests/e2e/ -v --tb=short -m "not real_llm" --ignore=tests/e2e/test_e2e_real_llm.py --cache-clear

      - name: Run stress tests
        run: |
          python -m pytest tests/stress/ -v --tb=short --cache-clear

      # Lane classification (P0-01 Required Change #4):
      # - real_llm: informational (excluded via `-m "not real_llm"`; needs OPENAI_API_KEY)
      # - stress: blocking (runs in CI; make informational only if it becomes flaky)
      # - unit / integration / e2e(mock): blocking
      - name: Run coverage report
        # `set -o pipefail` makes the `| tail` display-layer only: pytest's exit
        # code (incl. coverage.py's `fail_under=80` gate) propagates instead of
        # being masked by tail's success. Without it a shell override (sh/cmd/
        # pwsh) or running outside GitHub Actions would silently false-green.
        # `--junit-xml` emits a machine-readable JUnit report (passed/failed/
        # skipped/executed); the local `-p pytest_counts` plugin writes a
        # pytest-counts.json sidecar with the `collected`/`deselected` counts
        # that JUnit does not record (AC4: report must distinguish passed,
        # collected, skipped, failed). PYTHONPATH=scripts makes the plugin
        # importable without a dependency.
        # `--cov` (no path) measures ONLY the modules in pyproject.toml's
        # `[tool.coverage.run] source = [...]` (business code), NOT `.` which
        # would also measure tests/* — restoring the project's original coverage
        # scope. coverage 7.4.4's `omit = ["tests/*"]` is not reliably applied
        # under `--cov=.`, so `--cov` + the explicit source list is the robust
        # form (AC8 scope consistency).
        # IMPORTANT: `--cov` (no path) is NOT reliable either — coverage 7.4.4
        # then measures every imported file (sitecustomize.py, chardet/*,
        # _pytest/*, scripts/*) because the `source` config is not consistently
        # honored. The ONLY form proven to scope to business modules is EXPLICIT
        # `--cov=<dir>` for every source directory. This is verified by the
        # contract test test_cov_command_lists_all_source_dirs + a scope
        # assertion test in test_ci_summary.py that runs coverage and checks the
        # XML contains no system/third-party files.
        env:
          PYTHONPATH: scripts
          PYTEST_COUNTS_FILE: pytest-counts.json
          # AC8 reproducibility: record the EXACT pytest command run below so
          # ci_summary can surface it in the provenance line — a coverage figure
          # is only meaningful if the command (and toolchain, captured separately
          # via importlib.metadata versions) that produced it is recorded. This
          # must stay byte-identical to the `python -m pytest …` line in `run:`
          # below (minus the `2>&1 | tail` display layer, which is not part of
          # the pytest invocation). A contract test
          # (test_invocation_matches_run_command) enforces the two stay in sync.
          PYTEST_INVOCATION: >-
            python -m pytest tests/unit/ tests/integration/ tests/e2e/ -v --tb=short --cov=agents --cov=alerts --cov=api --cov=auth --cov=cache --cov=collaboration --cov=core --cov=db --cov=erp --cov=knowledge --cov=llm --cov=media --cov=rag --cov=router --cov=tools --cov-report=term-missing --cov-report=html --cov-report=xml --junit-xml=pytest-report.xml -p pytest_counts -m "not real_llm and not stress" --ignore=tests/e2e/test_e2e_real_llm.py --cache-clear
        run: |
          set -o pipefail
          python -m pytest tests/unit/ tests/integration/ tests/e2e/ -v --tb=short --cov=agents --cov=alerts --cov=api --cov=auth --cov=cache --cov=collaboration --cov=core --cov=db --cov=erp --cov=knowledge --cov=llm --cov=media --cov=rag --cov=router --cov=tools --cov-report=term-missing --cov-report=html --cov-report=xml --junit-xml=pytest-report.xml -p pytest_counts -m "not real_llm and not stress" --ignore=tests/e2e/test_e2e_real_llm.py --cache-clear 2>&1 | tail -30

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml
            pytest-report.xml
            pytest-counts.json
          retention-days: 14

      # Machine-readable test & coverage summary (P0-01 Required Change #5 / AC4).
      # ci_summary.py parses pytest-report.xml (JUnit: passed/failed/skipped/
      # executed), pytest-counts.json (collected/deselected), and coverage.xml
      # (coverage % + gate), surfacing all to the job/PR summary with a
      # provenance line (Python version + git SHA). Informational: never fails
      # the job (the blocking gates live in the pytest/coverage steps).
      - name: Test and coverage summary
        if: always()
        continue-on-error: true
        run: |
          python scripts/ci_summary.py pytest-report.xml coverage.xml pytest-counts.json >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          set -o pipefail
          echo "=== Test Summary ==="
          python -m pytest tests/ --co -q 2>&1 | tail -5

  # LANE B — supported development compatibility (pytest 8 era).
  #
  # Deliberately separate from the `test` job's LANE A pinned coverage
  # toolchain. This lane installs requirements.txt + requirements-dev.txt and
  # asserts a fresh resolver picks a pytest/pytest-asyncio pair that can
  # collect and run the unit suite. It is the regression guard for PR #21:
  # pytest>=8 combined with pytest-asyncio 0.23.0–0.23.3 raised
  # `AttributeError: 'FixtureDef' object has no attribute 'unittest'` during
  # async fixture setup. requirements-dev.txt floors pytest-asyncio at 0.23.4;
  # this job proves the floor is installable and sufficient in a clean env.
  dev-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Setup test environment
        run: cp .env.test .env

      - name: Install dev compatibility dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify pytest-asyncio compatibility floor
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from packaging.version import Version
          pytest_v = version("pytest")
          pa_v = Version(version("pytest-asyncio"))
          assert pa_v >= Version("0.23.4"), (
              f"pytest-asyncio {pa_v} is below the supported floor 0.23.4; "
              "pytest>=8 async fixtures would fail to collect (PR #21)."
          )
          print(f"pytest={pytest_v} pytest-asyncio={pa_v}")
          PY

      - name: Collect tests
        run: python -m pytest --collect-only -q

      - name: Run unit tests
        run: python -m pytest tests/unit/ -q -m "not real_llm and not stress"

      - name: Exercise declared pytest-asyncio floor (0.23.4)
        # The resolver normally picks the newest 0.23.x release, so asserting
        # `>= 0.23.4` does not prove the declared LOWER BOUND is safe. This step
        # pins the exact floor and reruns the async-fixture collection that
        # PR #21 fixed, proving 0.23.4 itself works with the pytest 8 range.
        run: |
          pip install "pytest-asyncio==0.23.4"
          python -c "from importlib.metadata import version; assert version('pytest-asyncio') == '0.23.4', version('pytest-asyncio')"
          python -m pytest tests/integration/test_integration.py -q -m "not real_llm"

  # Distributed Agent Runtime — real PostgreSQL + Redis acceptance lane.
  #
  # These tests deliberately CANNOT run in the `test` job: they spawn real OS
  # processes, a real Celery broker and real LangGraph checkpoints. Running them
  # with mocks would prove nothing about crash recovery, same-thread
  # serialization or side-effect idempotency — all three are exactly the claims
  # that regress silently when faked.
  runtime-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: csai_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DISTRIBUTED_DB_URL: postgresql://postgres:postgres@localhost:5432/csai_runtime_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Stage test environment
        # tests/integration/runtime imports runtime.errors -> db.database ->
        # core.config at collection time, and core/config.py fails closed when
        # API_KEY_ENABLED=true without an API_KEY. The other lanes (`test`,
        # `dev-compat`) already stage .env.test; without it this lane died at
        # collection with exit code 2 before running a single test.
        run: cp .env.test .env

      - name: Runtime end-to-end acceptance
        # checkpoint 跨进程恢复 / thread 串行与跨 thread 并发 / lease 崩溃接管 /
        # queue-worker 解耦 / worker kill 后从 checkpoint 续跑 / retry / DLQ +
        # 重放 / 副作用工具在本 Agent 侧去重（at-least-once + 幂等，非端到端 exactly-once） / run 事件流
        run: python -m pytest tests/integration/runtime -q -p no:cacheprovider

      - name: Runtime chaos acceptance (worker kill -9)
        # 混沌脚本输出结构化证据：崩溃前存在 checkpoint、接管 worker 不同、
        # 重投后副作用计数器仍为 1 且工具真实调用次数 >= 2、ledger 命中路径被走到。
        run: |
          python scripts/test_worker_crash_recovery.py \
            --output artifacts/runtime/chaos-ci.json
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("artifacts/runtime/chaos-ci.json").read_text())
          assert report["result"] == "PASS", report
          print("chaos:", report["result"])
          PY

      - name: Upload chaos evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-chaos-evidence
          path: artifacts/runtime/

  # P2-5: 安全扫描
  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit mypy
          pip install -r requirements.txt

      - name: Type checking — strict (new modules)
        run: |
          python -m mypy core/protocols.py core/token_tracker.py core/prompt_manager.py rag/reranker.py rag/query_rewriter.py api/dependencies.py api/routes/prompts.py --ignore-missing-imports --follow-imports=skip

      - name: Type checking — gradual (existing modules)
        continue-on-error: true
        run: |
          python -m mypy agents/ cache/ collaboration/ core/ rag/ router/ tools/ api/ auth/ db/ erp/ knowledge/ session_manager.py token_counter.py drift_detector.py --ignore-missing-imports

      # pip-audit is informational: a finding surfaces as a ⚠️ step result
      # (visible in the run UI) but does not block the job. `continue-on-error`
      # replaces the old `|| true`, which hid findings behind a green check.
      # To make dependency vulnerabilities blocking, drop continue-on-error.
      - name: Dependency vulnerability scan (pip-audit)
        continue-on-error: true
        run: |
          pip-audit --requirement requirements.txt --desc

      - name: Static security analysis (bandit)
        run: |
          bandit -r agents/ api/ auth/ cache/ collaboration/ core/ db/ erp/ knowledge/ rag/ router/ session_manager.py tools/ -ll --skip B101

      - name: Check for secrets in code
        run: |
          python scripts/check_secrets.py
          # 检查是否有硬编码的 API Key 或密码
          ! grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" . || { echo "❌ 发现疑似硬编码 API Key"; exit 1; }
          ! grep -rn "password\s*=\s*['\"][^'\"]\{8,\}['\"]" --include="*.py" . | grep -v "test\|mock\|placeholder\|example\|your_\|change-me\|do-not-use\|admin123\|test_" || { echo "❌ 发现疑似硬编码密码"; exit 1; }

  # ===== Docker 镜像构建（main 分支 + tag）=====
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_MODE=prod

  # ===== 部署到生产环境（需手动审批 + 服务器密钥）=====
  # 需在 GitHub Settings > Variables 配置 DEPLOY_HOST 才会触发
  # 需在 GitHub Settings > Secrets 配置 DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && (vars.DEPLOY_HOST || '') != ''  # yamllint disable-line rule:truthy
    environment:
      name: production
      url: https://${{ vars.DEPLOY_HOST || 'localhost' }}  # yamllint disable-line rule:line-length
    steps:
      - uses: actions/checkout@v6

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}  # yamllint disable-line rule:line-length
          username: ${{ secrets.DEPLOY_USER }}  # yamllint disable-line rule:line-length
          key: ${{ secrets.DEPLOY_SSH_KEY }}  # yamllint disable-line rule:line-length
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/csai' }}  # yamllint disable-line rule:line-length
            git pull origin main
            cp .env.prod .env
            # compose 文件在 deploy/compose/ 下，仓库根没有 docker-compose.yml
            docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.prod.yml pull
            docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.prod.yml up -d --build
            # 等待健康检查
            sleep 10
            curl -sf http://localhost:8000/api/health || exit 1
            # 分布式 Runtime 门禁：worker 必须真的起来，否则异步 Run 会永久停在 QUEUED。
            # 这里只做最低限度的存活/连通性确认；正确性由 runtime-e2e / runtime-chaos 证明。
            docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.prod.yml ps worker
            curl -sf 'http://localhost:8000/api/runs/dead' -H "X-API-Key: $API_KEY" >/dev/null \
              || echo "::warning::DLQ 端点不可达（可能缺少 API_KEY 或未启动 worker）"
            echo "✅ 部署完成"
